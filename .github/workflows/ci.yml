name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    # Applies the committed migrations from scratch to a real PostgreSQL server with the
    # production build (unit tests use in-memory PGlite; see docs/TECH_STACK.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worldforge
          POSTGRES_PASSWORD: worldforge
          POSTGRES_DB: worldforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldforge -d worldforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://worldforge:worldforge@127.0.0.1:5432/worldforge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply migrations from scratch
        run: pnpm --filter @worldforge/server db:migrate:prod
      - name: Re-apply migrations (must be a no-op)
        run: pnpm --filter @worldforge/server db:migrate:prod
      - name: Concurrency tests on real PostgreSQL (ticket 1.9)
        # PGlite runs one transaction at a time; these races need real parallel transactions.
        # Each run creates and drops its own throwaway database next to DATABASE_URL.
        run: pnpm --filter @worldforge/server test:pg
        env:
          REQUIRE_PG_TESTS: '1'
      - name: Verify schema
        run: |
          n=$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('accounts', 'sessions', 'audit_log')")
          test "$n" = "3"

  e2e:
    # Phase 1 exit-criteria run in a real browser (tools/e2e/farm-loop.mjs, ~1.5 min): register →
    # create character → farm → loot → equip → log out → log in → offline return summary, at 1440
    # and 390 px. The server is the real buildApp() on PGlite with a scaled farming clock
    # (apps/server/src/e2e/serve.ts); docs/TECH_STACK.md, "End-to-end run".
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start the e2e server and the web dev server
        run: |
          OFFLINE_CAP_SECONDS=1800 pnpm --filter @worldforge/server e2e:serve > "$RUNNER_TEMP/server.log" 2>&1 &
          pnpm --filter @worldforge/web dev > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 1
          done
          echo "servers did not come up"; cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: Exit-criteria run
        run: node tools/e2e/farm-loop.mjs http://localhost:5173 "$RUNNER_TEMP/e2e-screenshots"
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules/playwright
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-screenshots
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore

  e2e-first-session:
    # First-session flow (ticket 2.7, tools/e2e/first-session.mjs): register → forge a hero →
    # the guide → farm → first drop ("new" markers, notices) → equip → Tavern → guide closed and
    # remembered across a reload and a new login, at 1440 and 390 px. Faster farming clock (×600)
    # so the level-up, area-unlocked and quest-complete notices come within minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start the e2e server and the web dev server
        run: |
          E2E_TIME_SCALE=600 OFFLINE_CAP_SECONDS=36000 pnpm --filter @worldforge/server e2e:serve > "$RUNNER_TEMP/server.log" 2>&1 &
          pnpm --filter @worldforge/web dev > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 1
          done
          echo "servers did not come up"; cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: First-session run
        run: node tools/e2e/first-session.mjs http://localhost:5173 "$RUNNER_TEMP/e2e-screenshots"
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules/playwright
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-first-session-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-screenshots
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore

  e2e-phase2:
    # Phase 2 exit-criteria run (ticket 2.8, tools/e2e/phase2-exit.mjs, ~3 min): register → farm →
    # several areas, equipping drops → materials and a profession → story quests and a contract →
    # buy, sell, salvage, craft → the Nameless Crypt and the Gravewarden → the Sunken Abbey opens
    # and is farmed. The farming clock runs ×1200 (B.1 puts level 17 at ~30 game hours); the
    # script imports item bases from the built game-core.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worldforge/game-core build
      - name: Install Playwright with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start the e2e server and the web dev server
        run: |
          E2E_TIME_SCALE=1200 OFFLINE_CAP_SECONDS=360000 pnpm --filter @worldforge/server e2e:serve > "$RUNNER_TEMP/server.log" 2>&1 &
          pnpm --filter @worldforge/web dev > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 1
          done
          echo "servers did not come up"; cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: Phase 2 exit-criteria run
        run: node tools/e2e/phase2-exit.mjs http://localhost:5173 "$RUNNER_TEMP/e2e-screenshots"
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules/playwright
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-screenshots
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore

  e2e-phase3:
    # Phase 3 exit-criteria run (ticket 3.9, tools/e2e/phase3-exit.mjs): a fresh hunter plays to the
    # late game; the UI sets a loot filter, locks a valuable drop, upgrades (until a failure),
    # improves and reworks at the Forge, takes a targeted Abbey contract (a ring) and runs every
    # crypt tier; the run needs a Legendary, a set piece, a pity-guaranteed upgrade, tiers II and
    # III cleared and a valuable drop kept over capacity, and no request may be rate limited. The
    # farming clock runs ×1800; the database is kept on disk (E2E_DATA_DIR) so the telemetry
    # report can reconcile it with the audit log after the server stops.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The `runner` context is not available in job-level `env`, so set the data dir here.
      - run: echo "E2E_DATA_DIR=$RUNNER_TEMP/wf-e2e" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worldforge/game-core build
      - name: Install Playwright with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start the e2e server and the web dev server
        run: |
          mkdir -p "$E2E_DATA_DIR"
          E2E_TIME_SCALE=1800 OFFLINE_CAP_SECONDS=360000 pnpm --filter @worldforge/server e2e:serve > "$RUNNER_TEMP/server.log" 2>&1 &
          pnpm --filter @worldforge/web dev > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 1
          done
          echo "servers did not come up"; cat "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: Phase 3 exit-criteria run
        run: node tools/e2e/phase3-exit.mjs http://localhost:5173 "$RUNNER_TEMP/e2e-screenshots"
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules/playwright
      - name: Stop the e2e server (closes its database)
        run: |
          pkill -INT -f 'src/e2e/serve.ts' || true
          for i in $(seq 1 30); do
            pgrep -f 'src/e2e/serve.ts' > /dev/null || exit 0
            sleep 1
          done
          echo "e2e server did not stop"; exit 1
      - name: Reconcile telemetry with the audit log
        # Exit code 2 when a rollup differs from the audit log.
        run: PLAYTEST_DATA_DIR="$E2E_DATA_DIR" pnpm report:telemetry -- --db playtest --reconcile
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phase3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-screenshots
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
