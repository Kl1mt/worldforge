# Builds and starts the production stack (deploy/) on PRs that touch it (ticket D.1): shellcheck,
# compose config, both images, migrations, the server health check and Caddy on 127.0.0.1:8080,
# all through deploy/deploy.sh with a throwaway .env. The Cloudflare Tunnel is off here
# (COMPOSE_PROFILES empty); Caddy is checked the way cloudflared reaches it.
name: Deploy config

on:
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy*.yml'
      - 'pnpm-lock.yaml'
      - '**/package.json'

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x deploy/*.sh
      - name: Throwaway .env
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s/^DOMAIN=.*/DOMAIN=play.worldforge.test/; s/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build, migrate and start (deploy.sh)
        run: deploy/deploy.sh --no-pull --skip-backup
      - name: Smoke test
        run: |
          set -xeuo pipefail
          base=http://127.0.0.1:8080
          # Read each output first, then match: `cmd | grep -q` under pipefail fails when grep exits
          # early and the writer gets SIGPIPE (docker compose logs then exits 255).
          out=$(curl -fsS $base/api/health); grep -q '"db":"up"' <<<"$out"
          headers=$(curl -fsS -D- -o /dev/null $base/)
          for h in strict-transport-security content-security-policy x-content-type-options 'cache-control: no-cache'; do
            grep -qi "^$h" <<<"$headers" || { echo "missing header: $h"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/assets/missing-ABCDEFGH.js)" = 404
          # Ticket D.2: registration mode from .env, legal pages (template, then the mounted file).
          out=$(curl -fsS $base/api/config); grep -q '"mode":"invite"' <<<"$out"
          out=$(curl -fsS $base/api/legal/datenschutz); grep -q '"template":true' <<<"$out"
          printf '# Impressum\n\nCI Betreiber\n' > deploy/legal/impressum.md
          out=$(curl -fsS $base/api/legal/impressum); grep -q 'CI Betreiber' <<<"$out"
          rm deploy/legal/impressum.md
          out=$(deploy/admin.sh invite create --note ci); grep -q '^Invite code: ' <<<"$out"
          out=$(deploy/admin.sh invite list); grep -q 'note: ci' <<<"$out"
          # The player's IP comes from CF-Connecting-IP; a client-sent X-Forwarded-For is ignored.
          curl -fsS -o /dev/null -H 'CF-Connecting-IP: 203.0.113.7' -H 'X-Forwarded-For: 6.6.6.6' "$base/api/health?probe=cf"
          sleep 1
          out=$(docker compose -f deploy/docker-compose.yml logs server)
          probe=$(grep 'probe=cf' <<<"$out" || true)
          grep -q '"remoteAddress":"203.0.113.7"' <<<"$probe" || { echo "CF-Connecting-IP not used"; exit 1; }
          # Nothing is served on the host's public ports: no 80/443, no API, no database.
          for port in 80 443 3000 5432; do
            if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "port $port is published"; exit 1; fi
          done
      - name: Backup and idempotent re-deploy
        run: |
          deploy/backup.sh --kind manual
          # Ticket 8.6: the status file for the Readiness tab (a time and a size only).
          grep -Eq '^\{"finishedAt":"[0-9T:-]+Z","bytes":[0-9]+\}$' deploy/status/backup.json
          docker compose -f deploy/docker-compose.yml exec -T server cat /app/status/backup.json
          deploy/deploy.sh --no-pull --skip-backup
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
